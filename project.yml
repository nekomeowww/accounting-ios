name: Accounting
options:
  bundleIdPrefix: dev.innei
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  LedgerKit:
    path: Packages/LedgerKit
  ChatKit:
    url: https://github.com/Innei/ChatKit.git
    from: 0.1.0
  MarkdownView:
    url: https://github.com/Lakr233/MarkdownView.git
    exactVersion: 4.3.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 433DLLA855
    CODE_SIGN_STYLE: Automatic
targets:
  Accounting:
    type: application
    platform: iOS
    preBuildScripts:
      - name: Build pi Agent runtime
        script: /bin/sh "$SRCROOT/Runtime/build-for-xcode.sh"
        basedOnDependencyAnalysis: false
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: LedgerKit
        product: LedgerDomain
      - package: LedgerKit
        product: LedgerPersistence
      - package: ChatKit
        product: ChatKit
      - package: MarkdownView
        product: MarkdownView
      - package: LedgerKit
        product: AgentClient
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Accounting
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: 拍摄小票，交给 Agent 识别记账。
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.innei.musubicho
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  Accounting:
    build:
      targets:
        Accounting: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LedgerKit/LedgerDomainTests
        - package: LedgerKit/LedgerPersistenceTests
